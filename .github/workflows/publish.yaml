name: Publish @authara/browser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if test "$GITHUB_REF_NAME" != "$expected_tag"; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with Trusted Publisher
        run: npm publish --provenance --access public
