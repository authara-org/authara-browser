name: Release @authara/browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release state
        uses: actions/checkout@v5

      - name: Check Core release provenance
        id: provenance
        run: |
          core_version="$(jq -r '.core.version' .codegen/manifest.json)"
          test -n "$core_version"
          test "$core_version" != "null"
          if test "$core_version" = "unreleased"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update browser SDK release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable release PR auto-merge
        if: steps.release.outputs.prs_created == 'true' && steps.provenance.outputs.released == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTHARA_SDK_RELEASE_TOKEN || github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$RELEASE_PR")"
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$pr_number"

      - name: Checkout released source
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Node
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        if: steps.release.outputs.release_created == 'true'
        run: npm ci

      - name: Verify tag matches package version
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if test "$RELEASE_TAG" != "$expected_tag"; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Run tests
        if: steps.release.outputs.release_created == 'true'
        run: npm test

      - name: Build
        if: steps.release.outputs.release_created == 'true'
        run: npm run build

      - name: Publish to npm with Trusted Publisher
        if: steps.release.outputs.release_created == 'true'
        run: npm publish --provenance --access public
